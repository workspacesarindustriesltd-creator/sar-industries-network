name: CI

on:
  push:
    branches:
      - main
      - phase-2-authentication
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sar_industries_network"
      AUTH_SECRET: "ci-auth-secret-must-be-at-least-32-characters"
      AUTH_GITHUB_ID: "ci-client-id"
      AUTH_GITHUB_SECRET: "ci-client-secret"
      BOOTSTRAP_ADMIN_EMAIL: "ci-admin@example.com"
      BOOTSTRAP_ORGANIZATION_NAME: "SAR INDUSTRIES NETWORK"
      BOOTSTRAP_ORGANIZATION_SLUG: "sar-industries-network"
      NEXT_PUBLIC_APP_NAME: "SAR INDUSTRIES NETWORK"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
